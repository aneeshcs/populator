# Default experiment configuration for the POP ocean emulator.
# All paths are absolute for the NCAR GLADE filesystem.

seed: 0

data:
  root: /glade/campaign/collections/gdex/data/d651027/cesmLE/CESM-CAM5-BGC-LE/ocn/proc/tseries/monthly
  experiment: B20TRC5CNBDRD          # historical members for the base experiment
  grid_member: "001"                 # member whose file the static grid is read from
  grid_file: data/grid_gx1v6.nc      # written by scripts/build_grid.py
  stats_file: data/stats.nc          # written by scripts/compute_stats.py

  prognostic: [TEMP, SALT, UVEL, VVEL]   # 3-D state variables
  surface_prognostic: [SSH]              # 2-D state variables
  forcing: [SHF, SHF_QSW, SFWF, TAUX, TAUY]

  nlev: 60
  nlat: 384
  nlon: 320

  # Ensemble-member splits (POP-LENS member ids as zero-padded strings).
  train_members: ["002","003","004","005","006","007","008","009","010",
                  "011","012","013","014","015","016","017","018","019","020"]
  val_members:   ["001"]
  test_members:  ["021","022"]

  # Time window within each member's record (model months from file start).
  t_start: 360       # skip 1850-1879 spin-up portion for historical
  t_end: -1
  step_months: 1     # Δt = 1 model month

normalize:
  per_level: true    # standardize each z-level separately
  tendency_weighted_loss: true   # weight data loss by (sigma_field/sigma_tendency)^2
                                 # so persistence is no longer the easy minimum
                                 # (run-1 collapsed to F~0; see memory.md)

model:
  arch: spherical_unet
  width: 96          # base channel width
  depth: 4           # encoder/decoder stages
  blocks_per_stage: 2
  film_forcing: true # FiLM-condition the bottleneck on forcing + month
  residual_update: true   # predict tendency: x_{t+1} = x_t + dt * F(x_t, ...)
  history: 2         # condition on x(t-1), x(t) (Samudra-style) for stability

physics:
  diagnose_wvel: true
  barotropic: rigid_lid        # rigid_lid | free_surface
  loss_weights:
    data: 1.0
    continuity: 0.1            # rigid-lid surface kinematic
    barotropic: 0.1            # vertically integrated divergence
    heat: 0.02                 # heat-content budget vs SHF (lowered: conservation
    salt: 0.02                 # salt-content budget vs SFWF  is minimized by F=0,
                               # which pulls toward persistence; keep it gentle)
    stability: 0.02            # no spurious convective instability
    spectral: 0.0              # KE-spectrum slope (off by default)
  # Curriculum: physics weights ramp from 0 to full over this many steps.
  physics_warmup_steps: 2000

train:
  rollout_steps: 1
  # Long multi-step pushforward (memory-safe: per-step backward on detached
  # self-rollout) is the primary stability lever. Spend most of training at
  # long rollout so the model learns to correct its own accumulated error.
  rollout_curriculum: [[0, 2], [8000, 4], [20000, 8], [44000, 12], [60000, 16]]
  noise_injection: 0.1         # input-noise (denoiser) training, normalized units
  batch_size: 1                # one global field per sample (memory bound)
  grad_accum: 4
  epochs: 50
  lr: 2.0e-4
  weight_decay: 0.05
  warmup_steps: 1000
  amp: true                    # mixed precision (bf16 on A100/H100)
  grad_clip: 1.0
  num_workers: 4
  ckpt_dir: checkpoints/run3   # keep runs 1 & 2 intact
  log_dir: runs/run3
  log_every: 50
  ckpt_every: 2000

eval:
  rollout_months: 24           # forecast horizon for skill evaluation
  reference: persistence       # baseline to beat
